name: ML CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  ci:
    name: CI - Train and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train / run ML program
        run: python model.py

      - name: Run tests
        run: pytest -v

      - name: Upload metrics
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          path: metrics.json

  cd:
    name: CD - Deploy to GitHub Pages
    needs: ci            # runs only if CI passes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download metrics
        uses: actions/download-artifact@v4
        with:
          name: metrics

      - name: Build index.html with results
        run: |
          MODEL=$(python3 -c "import json;print(json.load(open('metrics.json'))['model'])")
          DATASET=$(python3 -c "import json;print(json.load(open('metrics.json'))['dataset'])")
          ACC=$(python3 -c "import json;print(json.load(open('metrics.json'))['accuracy'])")
          mkdir site
          sed -e "s/__MODEL__/$MODEL/" \
              -e "s/__DATASET__/$DATASET/" \
              -e "s/__ACCURACY__/$ACC/" \
              -e "s/__STATUS__/CI Passed - Deployed Successfully/" \
              index.html > site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

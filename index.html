<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ML CI/CD Pipeline</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; display: flex; justify-content: center; padding: 40px; }
    .card { background: #fff; padding: 30px 40px; border-radius: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.1); max-width: 480px; width: 100%; }
    h1 { margin-top: 0; font-size: 1.5em; }
    p { font-size: 1.05em; }
    .ok { color: #1a7f37; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <h1>ML CI/CD Pipeline</h1>
    <p><strong>Model:</strong> __MODEL__</p>
    <p><strong>Dataset:</strong> __DATASET__</p>
    <p><strong>Accuracy:</strong> __ACCURACY__%</p>
    <p><strong>CI/CD Status:</strong> <span class="ok">__STATUS__</span></p>
  </div>
</body>
</html>
